<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso privado · Portal Gastronómico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-parchment text-charcoal font-body">
  <main class="min-h-screen flex items-center justify-center px-6 py-16">
    <section class="w-full max-w-md bg-charcoal rounded-2xl p-8 text-parchment shadow-xl">
      <p class="text-gold font-semibold tracking-widest text-xs uppercase mb-3">Acceso privado</p>
      <h1 class="font-display text-4xl mb-3">Panel de contenido</h1>
      <p class="text-ash text-sm mb-7">Solo el administrador autorizado puede editar recetas, salsas y bebidas.</p>
      <form id="login-form">
        <label class="block text-sm font-medium mb-2" for="admin-password">Contraseña</label>
        <input id="admin-password" type="password" autocomplete="current-password" required class="w-full rounded-lg border border-ash/40 bg-white px-3 py-3 text-charcoal focus:outline-none focus:ring-2 focus:ring-gold">
        <button type="submit" class="mt-4 w-full bg-ember hover:bg-ember/90 px-5 py-3 rounded-lg font-semibold transition">Entrar al panel</button>
        <p id="login-message" role="alert" class="text-sm mt-3"></p>
      </form>
    </section>
  </main>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("admin-password").value;
      const message = document.getElementById("login-message");
      message.textContent = "Comprobando...";

      try {
        const response = await fetch("/api/admin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });
        const data = await response.json();
        if (!response.ok || !data.authenticated) {
          message.textContent = "La contraseña no es correcta.";
          return;
        }
        window.location.href = "/admin";
      } catch (error) {
        message.textContent = "No se pudo conectar al servidor.";
      }
    });
  </script>
</body>
</html>
