<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso privado · Portal Gastronómico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: {
      colors: { charcoal: "#0B0A09", smoke: "#1C1815", ember: "#FF6A00", lava: "#D92600", gold: "#FFB000", sulfur: "#FFB000", parchment: "#F3F0EC", ash: "#A0988E" },
      fontFamily: { display: ["Cinzel Decorative", "serif"], body: ["Inter", "sans-serif"] },
      boxShadow: { 'ember-glow': '0 0 25px -5px rgba(255, 106, 0, 0.5)', 'lava-glow': '0 0 35px -5px rgba(217, 38, 0, 0.6)' }
    } };
  </script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-charcoal text-gray-100 font-body">
  <canvas id="canvas-brasas" data-scope="viewport" aria-hidden="true" class="canvas-brasas-fondo"></canvas>
  <main class="min-h-screen flex items-center justify-center px-6 py-16">
    <section class="w-full max-w-md bg-charcoal rounded-2xl p-8 text-gray-100 shadow-xl">
      <a href="/index.html" class="brand-fire font-display text-lg sm:text-xl tracking-tight mb-6 inline-block">El Festín de Belcebú</a>
      <p class="text-gold font-semibold tracking-widest text-xs uppercase mb-3">Acceso privado</p>
      <h1 class="font-display text-4xl mb-3">Panel de contenido</h1>
      <p class="text-ash text-sm mb-7">Solo el administrador autorizado puede editar recetas, salsas y bebidas.</p>
      <form id="login-form">
        <label class="block text-sm font-medium mb-2" for="admin-email">Correo</label>
        <input id="admin-email" type="email" autocomplete="username" required class="w-full rounded-lg border border-ash/40 bg-smoke px-3 py-3 text-gray-100 focus:outline-none focus:ring-2 focus:ring-gold">
        <label class="block text-sm font-medium mb-2 mt-4" for="admin-password">Contraseña</label>
        <input id="admin-password" type="password" autocomplete="current-password" required class="w-full rounded-lg border border-ash/40 bg-smoke px-3 py-3 text-gray-100 focus:outline-none focus:ring-2 focus:ring-gold">
        <button type="submit" class="mt-4 w-full bg-gradient-to-r from-ember to-lava hover:shadow-ember-glow px-5 py-3 rounded-lg font-semibold transition">Entrar al panel</button>
        <p id="login-message" role="alert" class="text-sm mt-3"></p>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("admin-email").value.trim();
      const password = document.getElementById("admin-password").value;
      const message = document.getElementById("login-message");
      message.textContent = "Comprobando...";
      try {
        if (!window.supabaseClient) throw new Error("La conexión con Supabase no está configurada.");
        const { data: authData, error: authError } = await window.supabaseClient.auth.signInWithPassword({ email, password });
        if (authError) throw authError;

        const response = await fetch("/api/admin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ access_token: authData.session.access_token })
        });
        const data = await response.json();
        if (!response.ok || !data.authenticated) {
          await window.supabaseClient.auth.signOut();
          message.textContent = data.error || "Esta cuenta no está autorizada para administrar el sitio.";
          return;
        }
        window.location.href = "/admin-panel";
      } catch (error) {
        message.textContent = error.message || "No se pudo iniciar sesión.";
      }
    });
  </script>
  <script src="js/brasas.js"></script>
</body>
</html>
