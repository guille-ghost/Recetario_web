<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="tab-title">Receta | Fuego Real</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          charcoal: "#0B0A09",
          smoke: "#1C1815",
          ember: "#FF6A00", lava: "#D92600",
          gold: "#FFB000", sulfur: "#FFB000",
          parchment: "#F3F0EC",
          ash: "#A0988E"
        },
        fontFamily: {
          display: ["Cinzel Decorative", "serif"],
          body: ["Inter", "sans-serif"]
        },
        boxShadow: {
          'ember-glow': '0 0 25px -5px rgba(255, 106, 0, 0.5)',
          'lava-glow': '0 0 35px -5px rgba(217, 38, 0, 0.6)'
        }
      }
    }
  };
</script>
<link rel="stylesheet" href="css/custom.css" />
</head>
<body class="bg-charcoal text-gray-100 font-body">
<canvas id="canvas-brasas" data-scope="viewport" aria-hidden="true" class="canvas-brasas-fondo"></canvas>

<header class="site-header bg-charcoal/95 text-gray-100 sticky top-0 z-50 border-b border-ember/40 backdrop-blur">
  <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="index.html" class="brand-fire font-display text-lg sm:text-2xl md:text-3xl tracking-tight">El Festín de Belcebú</a>
    <nav class="hidden sm:flex gap-6 text-sm text-ash">
      <a href="index.html" class="hover:text-gold transition">Inicio</a>
      <a href="recetario.html" class="hover:text-gold transition">Recetario</a>
      <a href="catalogo.html" class="hover:text-gold transition">Salsas</a>
      <a href="bar.html" class="hover:text-gold transition">Bar</a>

    </nav>
  </div>
</header>

<main id="contenido-receta" class="max-w-7xl mx-auto px-6 py-10">
  <!-- Se rellena dinámicamente por receta-detalle.js -->
  <p class="text-ash">Cargando receta…</p>
</main>

<!-- MODAL DE PREPARACIÓN (salsas, acompañamientos y bebidas del maridaje) -->
<div id="modal-preparacion" class="hidden fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-0 sm:p-6">
  <div id="modal-overlay" class="absolute inset-0 bg-charcoal/70"></div>
  <div class="relative bg-charcoal w-full sm:max-w-lg sm:rounded-2xl rounded-t-2xl max-h-[90vh] overflow-y-auto shadow-2xl">
    <div class="sticky top-0 bg-charcoal border-b border-ash/20 flex items-start justify-between px-6 py-4">
      <div>
        <p id="modal-tipo" class="text-[11px] uppercase tracking-wide bg-ember/20 text-ember inline-block px-2 py-1 rounded-full mb-1"></p>
        <h3 id="modal-nombre" class="font-display text-2xl"></h3>
      </div>
      <button id="modal-cerrar" aria-label="Cerrar" class="text-2xl leading-none text-ash hover:text-ember transition">&times;</button>
    </div>
    <div class="px-6 py-5">
      <p id="modal-descripcion" class="text-sm text-ash mb-4"></p>
      <div class="flex gap-6 text-xs text-ash mb-6">
        <p><span class="font-semibold text-gray-100">Prep:</span> <span id="modal-tiempo"></span></p>
        <p><span class="font-semibold text-gray-100">Rinde:</span> <span id="modal-porciones"></span></p>
      </div>
      <h4 class="font-display text-lg mb-2 text-ember">Ingredientes</h4>
      <ul id="modal-ingredientes" class="space-y-1 text-sm text-gray-200 mb-6"></ul>
      <h4 class="font-display text-lg mb-2 text-ember">Preparación</h4>
      <ol id="modal-pasos" class="space-y-3 text-sm text-gray-200"></ol>
    </div>
  </div>
</div>

<template id="tpl-no-encontrada">
  <div class="text-center py-24">
    <p class="text-ember font-display text-3xl mb-3">Receta no encontrada</p>
    <p class="text-ash mb-6">El enlace no coincide con ninguna receta guardada en este navegador.</p>
    <a href="recetario.html" class="inline-block bg-ember text-gray-100 px-5 py-3 rounded-lg hover:bg-ember/90 transition">Volver al recetario</a>
  </div>
</template>

<footer class="mt-16 border-t border-ash/20 py-8 text-center text-xs text-ash">
  Portal Gastronómico · Ficha de receta con maridaje automático
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data.js"></script>
<script src="js/receta-detalle.js"></script>
<script src="js/brasas.js"></script>
</body>
</html>
